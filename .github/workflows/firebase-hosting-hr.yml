name: Deploy Belleforet HR to Firebase Hosting (belleforet-hr)

on:
  push:
    branches:
      - belleforet-hr-main

concurrency:
  group: firebase-hosting-belleforet-hr
  cancel-in-progress: true

jobs:
  build_and_deploy_hr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integrity guard & Next.js static export build
        run: npm run build

      - name: Deploy to Firebase Hosting Target (belleforet-hr ONLY)
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BELL_OPERATION }}' > firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/firebase-service-account.json"
          npx firebase-tools@latest deploy --only hosting:belleforet-hr --project bell-operation --non-interactive
          rm -f firebase-service-account.json
